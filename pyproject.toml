[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qudits-on-qubits"
version = "0.1.2"
description = "Hardware-aware compilation and benchmarking of qudit circuits encoded on qubit quantum processors."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Szymon Łysek" }
]

keywords = [
    "quantum-computing",
    "qudits",
    "qutrits",
    "quantum-compilation",
    "quantum-benchmarking",
    "qiskit",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=2,<3",
    "scipy",
    "pandas",
    "sympy",
    "matplotlib",
    "igraph",
    "tqdm",
    "ipython",
    "jupyterlab",
    "ipywidgets>=8,<9",
    "qiskit>=2,<2.2",
    "bqskit>=1.2.1,<1.3",
    "filelock>=3.16,<4",
    "psutil>=5.9,<8",
    "qiskit-aer>=0.17,<0.18",
    "qiskit-ibm-runtime>=0.34,<0.44.1",
    "qiskit-experiments>=0.13,<0.14",
    "python-dotenv",
    "iqm-client[qiskit]>=35,<36",
    "iqm-qubit-selector>=1.1,<2",
]

[project.urls]
Documentation = "https://github.com/slysek/QuditsOnQubits/blob/main/docs/README.md"
Homepage = "https://github.com/slysek/QuditsOnQubits"
Repository = "https://github.com/slysek/QuditsOnQubits"
Issues = "https://github.com/slysek/QuditsOnQubits/issues"

[project.scripts]
qoq-two-qutrit-bell = "qudits_on_qubits.vertical_slice.cli:entrypoint"
qoq-benchmark = "qudits_on_qubits.benchmarks.cli:entrypoint"


[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "build>=1.2,<2",
    "pyyaml>=6,<7",
]
mitigation = [
    "mthree>=3,<4",
    "iqm-error-reduction-tools>=0.2,<0.3",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
qudits_on_qubits = ["quantum_circuits/*.qpy"]
"qudits_on_qubits.benchmarks.theta_continuation.data" = ["*.qpy", "*.npy", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/bell_20260907"]
