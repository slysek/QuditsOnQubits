[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qudits-on-qubits"
version = "0.1.0"
description = "Tools for qutrit-on-qubit graph-state circuits, direct-basis benchmarks, and Bell measurement pipelines."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "sympy",
    "matplotlib",
    "igraph",
    "tqdm",
    "ipython",
    "jupyterlab",
    "qiskit",
    "qiskit-aer",
    "qiskit-ibm-runtime",
    "qiskit-experiments",
    "python-dotenv",
    "iqm-client[qiskit]",
]

[tool.setuptools.packages.find]
where = ["src"]
