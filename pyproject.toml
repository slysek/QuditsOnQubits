[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qudits-on-qubits"
version = "0.1.0"
description = "Tools for qutrit-on-qubit graph-state circuits, direct-basis benchmarks, and Bell measurement pipelines."
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=2,<3",
    "scipy",
    "pandas",
    "sympy",
    "matplotlib",
    "igraph",
    "tqdm",
    "ipython",
    "jupyterlab",
    "qiskit>=1.4,<2.2",
    "qiskit-aer>=0.17,<0.18",
    "qiskit-ibm-runtime>=0.34,<0.44.1",
    "qiskit-experiments>=0.13,<0.14",
    "python-dotenv",
    "iqm-client[qiskit]>=34,<35",
]

[tool.setuptools.packages.find]
where = ["src"]
